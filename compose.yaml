services:
    web:
        build: ./web
        volumes:
            - ./web:/app
            - node_modules_web:/app/node_modules
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - ${WEB_PORT:-80}:3000
        command: npm run production
        networks:
            - pablo-werlang
volumes:
    node_modules_web:
networks:
    pablo-werlang:
        name: pablo-werlang
